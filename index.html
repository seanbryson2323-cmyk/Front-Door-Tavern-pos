<title>Front Door Tavern · POS-TOASTER 1.1</title>
<style>
:root{--bg:#1e1f22;--bg2:#26282c;--bg3:#2f3237;--bg4:#3a3e44;--line:#43474e;--tx:#f4f5f7;--tx2:#c0c5cc;--tx3:#8e959e;--ac:#14b8a6;--ac2:#0d9488;--acs:rgba(20,184,166,.16);--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:16px;--panel:390px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select{font:inherit;color:var(--tx);background:var(--bg3);border:2px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;min-width:0}
input:focus{border-color:var(--ac)}
#app{display:grid;grid-template-columns:1fr var(--panel);grid-template-rows:64px 1fr;height:100vh;height:100dvh}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:#141518;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;min-width:0}
.logo{width:42px;height:42px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--ac),#0f766e);display:grid;place-items:center;padding:3px}
.logo svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.brand b{display:block;font-size:21px;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:700;color:var(--ac);letter-spacing:1.6px}
#clock{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
#clock b{font-size:20px;display:block}#clock span{font-size:12px;color:var(--tx2)}
#gear{width:50px;height:50px;border-radius:12px;background:var(--bg3);font-size:24px;flex:none}
#gear:hover{background:var(--bg4)}
#content{overflow:auto;padding:18px 20px 40px;min-height:0;background:var(--bg) url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cg opacity=%22.09%22%3E%3Cpath d=%22M18 90V47C5 42 5 15 28 11C38 3 62 3 72 11C95 15 95 42 82 47V90Q82 96 76 96H24Q18 96 18 90Z%22 fill=%22%23b8692a%22 stroke=%22%236b3a14%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M25 88V44C14 40 14 21 32 18C41 10 59 10 68 18C86 21 86 40 75 44V88Q75 90 73 90H27Q25 90 25 88Z%22 fill=%22%23f2c27a%22/%3E%3Cpath d=%22M30 80V46C22 42 22 27 35 24C43 17 57 17 65 24C78 27 78 42 70 46V80Z%22 fill=%22%23e9a94f%22 opacity=%22.45%22/%3E%3Cg transform=%22rotate%28-8 52 32%29%22%3E%3Crect x=%2240%22 y=%2224%22 width=%2224%22 height=%2215%22 rx=%224%22 fill=%22%23fde68a%22 stroke=%22%23d6a51e%22 stroke-width=%221.8%22/%3E%3Crect x=%2243%22 y=%2226.5%22 width=%229%22 height=%223%22 rx=%221.5%22 fill=%22%23fff8d6%22/%3E%3C/g%3E%3Cellipse cx=%2233%22 cy=%2265%22 rx=%225%22 ry=%223.2%22 fill=%22%23f2788a%22 opacity=%22.75%22/%3E%3Cellipse cx=%2267%22 cy=%2265%22 rx=%225%22 ry=%223.2%22 fill=%22%23f2788a%22 opacity=%22.75%22/%3E%3Ccircle cx=%2239%22 cy=%2256%22 r=%224.6%22 fill=%22%233b2412%22/%3E%3Ccircle cx=%2261%22 cy=%2256%22 r=%224.6%22 fill=%22%233b2412%22/%3E%3Ccircle cx=%2240.6%22 cy=%2254.4%22 r=%221.6%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2262.6%22 cy=%2254.4%22 r=%221.6%22 fill=%22%23fff%22/%3E%3Cpath d=%22M42 66Q50 75 58 66%22 fill=%22none%22 stroke=%22%233b2412%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/svg%3E") no-repeat right 28px bottom 24px/clamp(220px,38vw,460px)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;position:sticky;top:-18px;background:var(--bg);padding:6px 0 8px;z-index:5}
.homeBtn{flex:none;height:60px;padding:0 18px;border-radius:14px;background:var(--bg3);border:1px solid var(--line);font-weight:800;font-size:18px}
.homeBtn:hover{background:var(--bg4)}
.search{position:relative;flex:1}
.search input{width:100%;font-size:20px;height:60px;padding:0 54px 0 52px;border-radius:14px;background:var(--bg2)}
.search:before{content:"🔍";position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:20px;opacity:.75;pointer-events:none}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:10px;font-size:22px;color:var(--tx2);display:none}
.search.has .clr{display:block}
h1{font-size:28px;margin:4px 0 14px;display:flex;align-items:center;gap:12px}
h1 .sw{width:14px;height:30px;border-radius:5px;background:var(--cc)}
.sec{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 14px;border-radius:9px;font-weight:700;font-size:15px;color:var(--tx2)}
.seg button.on{background:var(--bg4);color:var(--tx)}
.quick{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;scrollbar-width:thin}
.quick .tile{flex:0 0 170px;min-height:84px}
.quick .none{color:var(--tx3);padding:16px 2px;font-size:15px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.catb{background:var(--bg2);border:1px solid var(--line);border-top:7px solid var(--cc);border-radius:var(--r);min-height:112px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .06s,background .1s}
.catb:hover{background:var(--bg3)}.catb:active{transform:scale(.97)}
.catb i{font-style:normal;font-size:30px}
.catb b{font-size:20px;font-weight:800}
.catb span{font-size:13px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{position:relative;text-align:left;background:var(--bg2);border:1px solid var(--line);border-left:7px solid var(--cc,#888);border-radius:var(--r);padding:14px 14px 12px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .06s,background .1s}
.tile:hover{background:var(--bg3)}.tile:active{transform:scale(.96);background:var(--bg4)}
.tile .nm{font-weight:750;font-size:17px;line-height:1.22;padding-right:22px}
.tile .pr{font-weight:850;font-size:19px;color:var(--ac);font-variant-numeric:tabular-nums}
.tile .pr sup{color:var(--warn);font-size:13px;margin-left:1px}
.tile .st{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:9px;font-size:18px;color:var(--tx3);line-height:34px;text-align:center}
.tile .st.on{color:#facc15}
.tile.today{box-shadow:0 0 0 2px #facc15 inset}
.tile.dim{opacity:.55}
.tile .tg{font-size:11px;font-weight:800;color:#2a1f00;background:#facc15;border-radius:5px;padding:1px 6px;align-self:flex-start}
.legend{font-size:13px;color:var(--tx3);margin:16px 0 0}.legend b{color:var(--warn)}
.empty{padding:40px 16px;text-align:center;color:var(--tx3)}.empty .e{font-size:46px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:750;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--bg4)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#03201c}.btn.pri:hover{background:#2dd4bf}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#052e16}
.btn.bad{background:transparent;border-color:var(--bad);color:#fca5a5}
.btn.big{font-size:20px;min-height:66px}
.btn:disabled{opacity:.38;cursor:not-allowed}
/* panel */
#panel{background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;flex:none}
.tabc{flex:none;padding:10px 14px;border-radius:11px;background:var(--bg3);border:2px solid transparent;font-weight:750;font-size:15px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabc.on{border-color:var(--ac);background:var(--acs);color:#ccfbf1}
.tabc small{color:var(--tx3);font-weight:600;margin-left:4px}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
.ph b{flex:1;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{color:var(--tx2);font-size:14px;font-weight:700;padding:8px 10px;border-radius:9px;background:var(--bg3)}
.lk:hover{background:var(--bg4)}
#closeSheet{display:none}
.lines{flex:1;overflow:auto;padding:6px 10px;min-height:0}
.line{background:var(--bg3);border-radius:12px;padding:10px 10px 10px 12px;margin-bottom:8px;border-left:5px solid var(--cc,#888)}
.line.paid{opacity:.5}
.line .r1{display:flex;gap:8px}
.line .n{flex:1;font-weight:750;font-size:16px;line-height:1.25}
.line .p{font-weight:850;font-variant-numeric:tabular-nums}
.line .md{font-size:13px;color:var(--warn);margin-top:3px}
.line .r2{display:flex;gap:6px;align-items:center;margin-top:8px}
.qb{width:46px;height:46px;border-radius:11px;background:var(--bg4);font-size:24px;font-weight:800}
.qb:active{background:var(--ac2)}
.qv{min-width:28px;text-align:center;font-weight:850;font-size:18px}
.r2 .sp{flex:1}
.sm{height:46px;padding:0 13px;border-radius:11px;background:var(--bg4);font-size:14px;font-weight:750}
.tag{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.tag.sent{background:#164e3f;color:#6ee7b7}.tag.new{background:#4a3712;color:#fcd34d}.tag.pd{background:#1e3a8a;color:#bfdbfe}
.tot{padding:10px 16px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;flex:none}
.tot .row{display:flex;justify-content:space-between;padding:2px 0;color:var(--tx2);font-size:15px}
.tot .row.g{color:var(--tx);font-size:26px;font-weight:850;padding-top:5px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 12px 12px;flex:none}
.acts .btn{flex-direction:column;gap:2px;font-size:15px;min-height:72px;padding:8px 4px;line-height:1.1}
.acts .btn i{font-style:normal;font-size:24px}
#sheetBar{display:none}
/* screens */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.on{border-color:var(--ac)}
.card h3{margin:0 0 4px;font-size:20px}
.card .amt{font-size:26px;font-weight:850;margin:6px 0;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;margin-top:10px}.card .row .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{color:var(--tx3);font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.stat .v{font-size:28px;font-weight:850;margin-top:4px;font-variant-numeric:tabular-nums}
h2{font-size:20px;margin:22px 0 10px}
.bars .b{display:grid;grid-template-columns:minmax(110px,260px) 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bars .track{height:16px;background:var(--bg3);border-radius:8px;overflow:hidden}
.bars .fill{height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.bars .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bars .q{text-align:right;font-weight:800}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--tx3);font-size:12px;text-transform:uppercase}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.payg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box .row{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums;color:var(--tx2)}
.box .row.g{font-size:24px;font-weight:850;color:var(--tx)}
.box .row.rem{font-size:28px;font-weight:900;color:var(--ac)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.opt{flex:1;min-width:76px;min-height:56px;border-radius:12px;background:var(--bg3);border:2px solid var(--line);font-weight:800;font-size:16px;line-height:1.1;padding:6px}
.opt small{display:block;font-size:12px;color:var(--tx3);font-weight:600}
.opt.on{border-color:var(--ac);background:var(--acs)}
.lbl{font-size:13px;color:var(--tx3);font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin:14px 0 4px}
.chk{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--bg3);margin-bottom:6px;border:2px solid transparent;width:100%;text-align:left}
.chk.on{border-color:var(--ac)}.chk span{flex:1}
.change{font-size:30px;font-weight:900;color:var(--ok);margin-top:10px}
.pe-row{display:grid;grid-template-columns:1fr 110px 80px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pe-row input{padding:8px 10px;width:100%}
.pe-row .e{font-size:12px;color:var(--warn);font-weight:800}.pe-row .e.ok{color:var(--ok)}
/* modal & menu */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mh h2{margin:0;flex:1;font-size:22px}
.mb{padding:14px 18px;overflow:auto}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mod{background:var(--bg3);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-weight:750;min-height:56px}
.mod small{display:block;color:var(--tx3);font-weight:600;font-size:13px}
.mod.on{border-color:var(--ac);background:var(--acs)}
.menuList .btn{width:100%;justify-content:flex-start;margin-bottom:8px;font-size:18px}
.ticket{background:#fffef5;color:#111;font-family:"Courier New",ui-monospace,monospace;padding:16px;border-radius:6px;font-size:15px;line-height:1.4}
.ticket h3{text-align:center;margin:0 0 4px;font-size:18px}.ticket .c{text-align:center}
.ticket hr{border:0;border-top:1px dashed #555;margin:8px 0}
.ticket .it{font-weight:700}.ticket .mm{padding-left:22px}.ticket .rw{display:flex;justify-content:space-between}
#note{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#0f3d38;border:1px solid var(--ac);color:#ccfbf1;padding:12px 20px;border-radius:12px;font-weight:750;opacity:0;pointer-events:none;transition:.18s;z-index:70;max-width:90vw;text-align:center}
#note.on{opacity:1;transform:translateX(-50%)}
#foot{font-size:12px;color:var(--tx3);text-align:center;padding:30px 10px 4px}
.legal{font-size:16px;line-height:1.55;color:var(--tx2)}.legal b{color:var(--tx)}.legal ul{padding-left:20px;margin:10px 0}.legal li{margin:8px 0}.legal .cr{font-weight:800;color:var(--tx);margin-top:14px}.legal .disc{font-size:13px;color:var(--tx3)}
.footlink{color:var(--ac);font-size:12px;text-decoration:underline;padding:4px 2px}
#printArea{display:none}
@media (max-width:1050px){:root{--panel:340px}}
@media (max-width:820px){
 html,body{font-size:16px}
 #app{grid-template-columns:1fr;grid-template-rows:58px 1fr 76px}
 #top{grid-column:1;gap:8px;padding:0 10px}

 .bars .b{grid-template-columns:110px 1fr 44px}
 #note{bottom:160px}
 .pe-row{grid-template-columns:1fr 92px 64px}
}
@media print{

}

/* ===== POS-TOASTER 1.1 — app logic ===== */
const KEY='fdt-pos-toaster-1.1';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2);
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const ITEM=Object.fromEntries(MENU.map(m=>[m.id,m]));
const byName=n=>MENU.find(m=>m.name===n);
function fresh(){return{tabs:[],activeId:null,closed:[],favs:DEFAULT_FAVS.map(n=>byName(n)).filter(Boolean).map(m=>m.id),recents:[],prices:{},taxRate:6,seq:1,orderNo:1001}}
let S;
function load(){try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=fresh()}
 S.favs=S.favs.filter(id=>ITEM[id]);S.recents=S.recents.filter(id=>ITEM[id]);
 S.tabs.forEach(t=>t.lines=t.lines.filter(l=>ITEM[l.itemId]));
 if(S.activeId&&!S.tabs.find(t=>t.id===S.activeId))S.activeId=S.tabs[0]?S.tabs[0].id:null}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

 sub=r2(sub);const tax=r2(taxable*S.taxRate/100);let tip=0;if(t.tipAmt!=null)tip=r2(t.tipAmt);else if(t.tipPct)tip=r2(food*t.tipPct/100);
 const total=r2(sub+tax+tip);const paid=r2((t.payments||[]).reduce((a,p)=>a+p.amount,0));return{sub,tax,tip,total,paid,rem:r2(total-paid),food:r2(food)}}

 modal('Modify: '+esc(m.name)+(l.qty>1?' ×'+l.qty:''),h,`<button class="btn" data-a="close">Cancel</button><button class="btn pri" data-a="modsave">Save</button>`)}

 modal('＋ New Tab',`<div class="lbl">Tap a table — or type a name</div><div style="display:flex;gap:8px;margin-bottom:12px"><input id="tabname" placeholder="Name (e.g. Mike, Booth 3)" style="flex:1" autocomplete="off"><button class="btn pri" data-a="mktab">Open</button></div><div class="mods">${tb.map(n=>`<button class="mod" data-a="mktabq" data-id="${n}">${n}</button>`).join('')}</div>`)}
function menuModal(){modal('⚙ Menu',`<div class="menuList"><button class="btn" data-a="go" data-id="tabs">🗂️ Open Tabs (${S.tabs.length})</button><button class="btn" data-a="go" data-id="pay">💳 Payment</button><button class="btn" data-a="go" data-id="reports">📊 Today's Report</button><button class="btn" data-a="go" data-id="prices">🏷️ Menu Prices</button><button class="btn" data-a="go" data-id="settings">⚙️ Settings &amp; Reset</button><button class="btn" data-a="about">📜 About / Properties &amp; Licensing</button></div>`)}
function aboutModal(){modal('📜 Properties, Rights, Licensing &amp; Ownership',`<div class="legal">
<p><b>Front Door Tavern POS-TOASTER 1.1.</b> Properties, rights, licensing and ownership are courtesy of <b>Sean James Bryson</b>. Unauthorized use without pre-approved permission is in direct violation of U.S. copyright law and will be sent a cease and desist letter, and TOASTER LLC can pursue the following:</p>
<ul>

<li><b>Actual Damages.</b> The financial losses the company suffered plus any profits the infringer made from the piracy.</li>
<li><b>Statutory Damages.</b> If the company doesn't want to prove exact financial loss, they can choose statutory damages ranging from $750 to $30,000 per pirated work. If the company proves the piracy was “willful,” the judge can increase damages up to $150,000 per work.</li>

let nt;function notify(m){const e=$('#note');e.textContent=m;e.classList.add('on');clearTimeout(nt);nt=setTimeout(()=>e.classList.remove('on'),1400);return ''}
/* ---------- events ---------- */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el){if(e.target.id==='modal')closeModal();return}
 if(el.disabled)return;const a=el.dataset.a,id=el.dataset.id;const t=active();
 switch(a){
 case'home':U.screen='home';U.cat=null;U.q='';U.sheet=false;render();$('#content').scrollTop=0;break;
 case'cat':U.screen='cat';U.cat=id;U.q='';render();$('#content').scrollTop=0;break;
 case'clearq':U.q='';render();{const q=$('#q');q&&q.focus()}break;
 case'quick':U.quick=id;render();break;
 case'fav':e.stopPropagation();S.favs=S.favs.includes(id)?S.favs.filter(x=>x!==id):[...S.favs,id];notify(S.favs.includes(id)?'★ Added to favorites':'Removed from favorites');render();break;
 case'item':tapItem(id);break;
 case'sauce':{const C=U.modalCtx;closeModal();addItem(C.id,[{n:id,p:0}]);break}
 case'inc':{const l=t.lines.find(x=>x.uid===id);if(l){l.qty++;render()}break}
 case'dec':{const l=t.lines.find(x=>x.uid===id);if(l){l.qty--;if(l.qty<=0){t.lines=t.lines.filter(x=>x!==l);notify('Removed '+ITEM[l.itemId].name)}render()}break}
 case'mods':openMods(id);break;
 case'modt':{const C=U.modalCtx;const m=ITEM[active().lines.find(x=>x.uid===C.uid).itemId];
  const excl=g=>{if(g.includes(id))C.sel=C.sel.filter(x=>!g.includes(x)||x===id)};
  if(C.sel.includes(id))C.sel=C.sel.filter(x=>x!==id);else{C.sel.push(id);if(m.sauce)excl(SAUCES);excl(TEMPS)}drawMods();break}
 case'modsave':{const C=U.modalCtx;const l=active().lines.find(x=>x.uid===C.uid);const pm=Object.fromEntries(ADDONS);
  const nm=C.sel.map(n=>({n,p:pm[n]||0}));if(l.sent&&JSON.stringify(nm)!==JSON.stringify(l.mods))l.sent=false;l.mods=nm;closeModal();render();notify('Modifiers saved');break}
 case'switch':S.activeId=id;U.pay={mode:null,split:null,n:2,sel:{},tendered:''};if(U.screen==='tabs'){U.screen='home'}render();notify('Switched to '+active().name);break;
 case'newtab':newTabModal();setTimeout(()=>{const i=$('#tabname');i&&i.focus()},30);break;
 case'mktab':{const v=$('#tabname').value;closeModal();newTab(v);U.sheet=false;render();notify('Opened '+active().name);break}
 case'mktabq':{closeModal();const ex=S.tabs.find(x=>x.name===id);if(ex){S.activeId=ex.id;notify(id+' already open — switched to it')}else{newTab(id);notify('Opened '+id)}render();break}
 case'renametab':{const n=prompt('Tab name',t.name);if(n&&n.trim()){t.name=n.trim();render()}break}
 case'closetab':S.tabs=S.tabs.filter(x=>x!==t);S.activeId=S.tabs.length?S.tabs[S.tabs.length-1].id:null;render();notify('Tab closed');break;
 case'voidtab':{const x=S.tabs.find(y=>y.id===id);if(x.lines.length&&!confirm('Void '+x.name+' and all its items? This cannot be undone.'))break;S.tabs=S.tabs.filter(y=>y!==x);if(S.activeId===id)S.activeId=S.tabs.length?S.tabs[S.tabs.length-1].id:null;render();notify(x.name+' closed');break}
 case'send':sendKitchen();break;
 case'print':doPrint(receiptHTML(checkFor(t)));break;
 case'printticket':doPrint(U._ticket||'');break;
 case'printrec':case'viewrec':{const r=S.closed.find(x=>x.no==id);if(!r)break;if(a==='printrec')doPrint(receiptHTML(r));else modal('Order #'+r.no,receiptHTML(r),`<button class="btn" data-a="printrec" data-id="${r.no}">🖨 Print</button><button class="btn pri" data-a="close">Close</button>`);break}
 case'pay':U.screen='pay';U.sheet=false;U.pay={mode:null,split:null,n:2,sel:{},tendered:''};render();$('#content').scrollTop=0;break;
 case'paytab':S.activeId=id;U.screen='pay';U.pay={mode:null,split:null,n:2,sel:{},tendered:''};render();break;
 case'backorder':U.screen='home';render();break;
 case'tip':t.tipAmt=null;t.tipPct=+id||null;render();break;
 case'tipcustom':{const v=prompt('Custom tip amount ($)',t.tipAmt!=null?t.tipAmt:'');if(v===null)break;const n=parseFloat(v);if(isNaN(n)||n<0){notify('Enter a valid amount');break}t.tipAmt=r2(n);t.tipPct=null;render();break}
 case'split':U.pay.split=id||null;U.pay.sel={};U.pay.mode=null;render();break;
 case'splitn':U.pay.n=+id;render();break;
 case'sel':U.pay.sel[id]=!U.pay.sel[id];render();break;
 case'cash':U.pay.mode='cash';U.pay.tendered='';render();setTimeout(()=>{const i=$('#tendered');i&&i.focus()},30);break;
 case'tender':U.pay.tendered=String(r2(+id).toFixed(2));render();break;
 case'cashdone':{const ten=parseFloat(U.pay.tendered);recordPayment('cash',{tendered:ten,change:r2(ten-U.pay.charge)});break}
 case'card':{const amt=U.pay.charge;modal('💳 Card',`<div class="empty"><div class="e">📶</div><h2 id="cardst">Processing ${money(amt)}…</h2><p>Simulated card reader — no real charge.</p></div>`);
  setTimeout(()=>{const l4=String(1000+Math.floor(Math.random()*9000));const s=$('#cardst');if(s)s.textContent='Approved ••••'+l4;setTimeout(()=>{closeModal();recordPayment('card',{last4:l4})},500)},700);break}
 case'sheet':U.sheet=!U.sheet;renderPanel();break;
 case'gear':menuModal();break;
 case'about':closeModal();aboutModal();break;
 case'go':closeModal();U.screen=id;U.sheet=false;render();$('#content').scrollTop=0;break;
 case'close':closeModal();break;
 case'resetprices':if(confirm('Reset every edited price back to the estimate?')){S.prices={};render();notify('Prices reset to estimates')}break;
 case'taxdef':S.taxRate=6;render();notify('Tax set to 6%');break;
 case'reset':if(confirm('Reset all demo data (tabs, orders, favorites)?')){const p=S.prices;S=fresh();S.prices=p;U.screen='home';U.q='';render();notify('Demo data reset')}break;
 }});
document.addEventListener('input',e=>{const el=e.target;
 if(el.id==='q'){U.q=el.value;if(U.q&&U.screen!=='home'&&U.screen!=='cat')U.screen='home';renderContent()}
 else if(el.id==='tendered'){U.pay.tendered=el.value;const ten=parseFloat(el.value);const chg=isNaN(ten)?null:r2(ten-U.pay.charge);$('#change').textContent=chg==null?'Enter amount':chg<0?'Short '+money(-chg):'Change: '+money(chg);document.querySelector('[data-a="cashdone"]').disabled=!(chg!=null&&chg>=0)}
 else if(el.dataset.pe){const v=parseFloat(el.value);if(!isNaN(v)&&v>=0){S.prices[el.dataset.pe]=r2(v);save();const s=el.parentNode.querySelector('.e');s.textContent='✓ set';s.className='e ok';renderPanel()}}
 else if(el.id==='pf'){U.pf=el.value;renderContent();const p=$('#pf');p.focus();p.setSelectionRange(p.value.length,p.value.length)}
 else if(el.id==='taxin'){const v=parseFloat(el.value);if(!isNaN(v)&&v>=0&&v<=20){S.taxRate=v;save();renderPanel()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else if(U.q){U.q='';render()}}
 if(e.key==='Enter'){if(e.target.id==='tabname'){document.querySelector('[data-a="mktab"]').click()}
  else if(e.target.id==='q'){const f=document.querySelector('#content .grid .tile');if(f){tapItem(f.dataset.id)}}
  else if(e.target.id==='tendered'){const b=document.querySelector('[data-a="cashdone"]');if(b&&!b.disabled)b.click()}}
 if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){const q=$('#q');if(q){e.preventDefault();q.focus()}}});
function tick(){const d=new Date();$('#clock').innerHTML=`<b>${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</b><span>${d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric',year:'numeric'})}</span>`}
load();tick();setInterval(tick,10000);render();
</script>
