<title>Front Door Tavern · POS-TOASTER 1.1</title>
<style>
:root{--bg:#1e1f22;--bg2:#26282c;--bg3:#2f3237;--bg4:#3a3e44;--line:#43474e;--tx:#f4f5f7;--tx2:#c0c5cc;--tx3:#8e959e;--ac:#14b8a6;--ac2:#0d9488;--acs:rgba(20,184,166,.16);--ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--r:16px;--panel:390px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:17px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input,select{font:inherit;color:var(--tx);background:var(--bg3);border:2px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;min-width:0}
input:focus{border-color:var(--ac)}
#app{display:grid;grid-template-columns:1fr var(--panel);grid-template-rows:64px 1fr;height:100vh;height:100dvh}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:0 16px;background:#141518;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;min-width:0}
.logo{width:42px;height:42px;flex:none;border-radius:11px;background:linear-gradient(135deg,var(--ac),#0f766e);display:grid;place-items:center;padding:3px}
.logo svg{display:block;width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.brand b{display:block;font-size:21px;font-weight:800;white-space:nowrap}
.brand small{display:block;font-size:11px;font-weight:700;color:var(--ac);letter-spacing:1.6px}
#clock{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;line-height:1.15}
#clock b{font-size:20px;display:block}#clock span{font-size:12px;color:var(--tx2)}
#gear{width:50px;height:50px;border-radius:12px;background:var(--bg3);font-size:24px;flex:none}
#gear:hover{background:var(--bg4)}
#content{overflow:auto;padding:18px 20px 40px;min-height:0;background:var(--bg) url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Cg opacity=%22.09%22%3E%3Cpath d=%22M18 90V47C5 42 5 15 28 11C38 3 62 3 72 11C95 15 95 42 82 47V90Q82 96 76 96H24Q18 96 18 90Z%22 fill=%22%23b8692a%22 stroke=%22%236b3a14%22 stroke-width=%222.5%22 stroke-linejoin=%22round%22/%3E%3Cpath d=%22M25 88V44C14 40 14 21 32 18C41 10 59 10 68 18C86 21 86 40 75 44V88Q75 90 73 90H27Q25 90 25 88Z%22 fill=%22%23f2c27a%22/%3E%3Cpath d=%22M30 80V46C22 42 22 27 35 24C43 17 57 17 65 24C78 27 78 42 70 46V80Z%22 fill=%22%23e9a94f%22 opacity=%22.45%22/%3E%3Cg transform=%22rotate%28-8 52 32%29%22%3E%3Crect x=%2240%22 y=%2224%22 width=%2224%22 height=%2215%22 rx=%224%22 fill=%22%23fde68a%22 stroke=%22%23d6a51e%22 stroke-width=%221.8%22/%3E%3Crect x=%2243%22 y=%2226.5%22 width=%229%22 height=%223%22 rx=%221.5%22 fill=%22%23fff8d6%22/%3E%3C/g%3E%3Cellipse cx=%2233%22 cy=%2265%22 rx=%225%22 ry=%223.2%22 fill=%22%23f2788a%22 opacity=%22.75%22/%3E%3Cellipse cx=%2267%22 cy=%2265%22 rx=%225%22 ry=%223.2%22 fill=%22%23f2788a%22 opacity=%22.75%22/%3E%3Ccircle cx=%2239%22 cy=%2256%22 r=%224.6%22 fill=%22%233b2412%22/%3E%3Ccircle cx=%2261%22 cy=%2256%22 r=%224.6%22 fill=%22%233b2412%22/%3E%3Ccircle cx=%2240.6%22 cy=%2254.4%22 r=%221.6%22 fill=%22%23fff%22/%3E%3Ccircle cx=%2262.6%22 cy=%2254.4%22 r=%221.6%22 fill=%22%23fff%22/%3E%3Cpath d=%22M42 66Q50 75 58 66%22 fill=%22none%22 stroke=%22%233b2412%22 stroke-width=%223%22 stroke-linecap=%22round%22/%3E%3C/g%3E%3C/svg%3E") no-repeat right 28px bottom 24px/clamp(220px,38vw,460px)}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px;position:sticky;top:-18px;background:var(--bg);padding:6px 0 8px;z-index:5}
.homeBtn{flex:none;height:60px;padding:0 18px;border-radius:14px;background:var(--bg3);border:1px solid var(--line);font-weight:800;font-size:18px}
.homeBtn:hover{background:var(--bg4)}
.search{position:relative;flex:1}
.search input{width:100%;font-size:20px;height:60px;padding:0 54px 0 52px;border-radius:14px;background:var(--bg2)}
.search:before{content:"🔍";position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:20px;opacity:.75;pointer-events:none}
.search .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:10px;font-size:22px;color:var(--tx2);display:none}
.search.has .clr{display:block}
h1{font-size:28px;margin:4px 0 14px;display:flex;align-items:center;gap:12px}
h1 .sw{width:14px;height:30px;border-radius:5px;background:var(--cc)}
.sec{display:flex;align-items:center;gap:8px;margin:4px 0 10px}
.seg{display:inline-flex;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:3px}
.seg button{padding:9px 14px;border-radius:9px;font-weight:700;font-size:15px;color:var(--tx2)}
.seg button.on{background:var(--bg4);color:var(--tx)}
.quick{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px;margin-bottom:18px;scrollbar-width:thin}
.quick .tile{flex:0 0 170px;min-height:84px}
.quick .none{color:var(--tx3);padding:16px 2px;font-size:15px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.catb{background:var(--bg2);border:1px solid var(--line);border-top:7px solid var(--cc);border-radius:var(--r);min-height:112px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;transition:transform .06s,background .1s}
.catb:hover{background:var(--bg3)}.catb:active{transform:scale(.97)}
.catb i{font-style:normal;font-size:30px}
.catb b{font-size:20px;font-weight:800}
.catb span{font-size:13px;color:var(--tx3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.tile{position:relative;text-align:left;background:var(--bg2);border:1px solid var(--line);border-left:7px solid var(--cc,#888);border-radius:var(--r);padding:14px 14px 12px;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;gap:8px;transition:transform .06s,background .1s}
.tile:hover{background:var(--bg3)}.tile:active{transform:scale(.96);background:var(--bg4)}
.tile .nm{font-weight:750;font-size:17px;line-height:1.22;padding-right:22px}
.tile .pr{font-weight:850;font-size:19px;color:var(--ac);font-variant-numeric:tabular-nums}
.tile .pr sup{color:var(--warn);font-size:13px;margin-left:1px}
.tile .st{position:absolute;top:4px;right:4px;width:34px;height:34px;border-radius:9px;font-size:18px;color:var(--tx3);line-height:34px;text-align:center}
.tile .st.on{color:#facc15}
.tile.today{box-shadow:0 0 0 2px #facc15 inset}
.tile.dim{opacity:.55}
.tile .tg{font-size:11px;font-weight:800;color:#2a1f00;background:#facc15;border-radius:5px;padding:1px 6px;align-self:flex-start}
.legend{font-size:13px;color:var(--tx3);margin:16px 0 0}.legend b{color:var(--warn)}
.empty{padding:40px 16px;text-align:center;color:var(--tx3)}.empty .e{font-size:46px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:12px;padding:12px 18px;font-weight:750;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:var(--bg4)}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#03201c}.btn.pri:hover{background:#2dd4bf}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#052e16}
.btn.bad{background:transparent;border-color:var(--bad);color:#fca5a5}
.btn.big{font-size:20px;min-height:66px}
.btn:disabled{opacity:.38;cursor:not-allowed}
/* panel */
#panel{background:var(--bg2);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin;flex:none}
.tabc{flex:none;padding:10px 14px;border-radius:11px;background:var(--bg3);border:2px solid transparent;font-weight:750;font-size:15px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabc.on{border-color:var(--ac);background:var(--acs);color:#ccfbf1}
.tabc small{color:var(--tx3);font-weight:600;margin-left:4px}
.ph{display:flex;align-items:center;gap:8px;padding:10px 14px 4px}
.ph b{flex:1;font-size:19px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lk{color:var(--tx2);font-size:14px;font-weight:700;padding:8px 10px;border-radius:9px;background:var(--bg3)}
.lk:hover{background:var(--bg4)}
#closeSheet{display:none}
.lines{flex:1;overflow:auto;padding:6px 10px;min-height:0}
.line{background:var(--bg3);border-radius:12px;padding:10px 10px 10px 12px;margin-bottom:8px;border-left:5px solid var(--cc,#888)}
.line.paid{opacity:.5}
.line.voided{opacity:.85}
.line.voided .n,.line.voided .p,.line.voided .md{text-decoration:line-through;color:var(--tx3)}
.tag.void{background:#7f1d1d;color:#fecaca}
.line .r2{flex-wrap:wrap}
.sm.bad{color:#fca5a5;border:1px solid var(--bad);background:transparent}
.payg .row.voided{text-decoration:line-through;color:var(--tx3)}
.vr{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.vr .mod{flex:1;min-width:130px;text-align:center}
#vother{width:100%;margin-top:4px}
.line .r1{display:flex;gap:8px}
.line .n{flex:1;font-weight:750;font-size:16px;line-height:1.25}
.line .p{font-weight:850;font-variant-numeric:tabular-nums}
.line .md{font-size:13px;color:var(--warn);margin-top:3px}
.line .r2{display:flex;gap:6px;align-items:center;margin-top:8px}
.qb{width:46px;height:46px;border-radius:11px;background:var(--bg4);font-size:24px;font-weight:800}
.qb:active{background:var(--ac2)}
.qv{min-width:28px;text-align:center;font-weight:850;font-size:18px}
.r2 .sp{flex:1}
.sm{height:46px;padding:0 13px;border-radius:11px;background:var(--bg4);font-size:14px;font-weight:750}
.tag{font-size:11px;font-weight:800;padding:3px 7px;border-radius:6px;text-transform:uppercase}
.tag.sent{background:#164e3f;color:#6ee7b7}.tag.new{background:#4a3712;color:#fcd34d}.tag.pd{background:#1e3a8a;color:#bfdbfe}
.tot{padding:10px 16px 4px;border-top:1px solid var(--line);font-variant-numeric:tabular-nums;flex:none}
.tot .row{display:flex;justify-content:space-between;padding:2px 0;color:var(--tx2);font-size:15px}
.tot .row.g{color:var(--tx);font-size:26px;font-weight:850;padding-top:5px}
.acts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:10px 12px 12px;flex:none}
.acts .btn{flex-direction:column;gap:2px;font-size:15px;min-height:72px;padding:8px 4px;line-height:1.1}
.acts .btn i{font-style:normal;font-size:24px}
#sheetBar{display:none}
/* screens */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card.on{border-color:var(--ac)}
.card h3{margin:0 0 4px;font-size:20px}
.card .amt{font-size:26px;font-weight:850;margin:6px 0;font-variant-numeric:tabular-nums}
.card .row{display:flex;gap:8px;margin-top:10px}.card .row .btn{flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat .k{color:var(--tx3);font-size:12px;text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.stat .v{font-size:28px;font-weight:850;margin-top:4px;font-variant-numeric:tabular-nums}
h2{font-size:20px;margin:22px 0 10px}
.bars .b{display:grid;grid-template-columns:minmax(110px,260px) 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bars .track{height:16px;background:var(--bg3);border-radius:8px;overflow:hidden}
.bars .fill{height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac))}
.bars .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.bars .q{text-align:right;font-weight:800}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th,table.t td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:left}
table.t th{color:var(--tx3);font-size:12px;text-transform:uppercase}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.payg{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{background:var(--bg2);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.box .row{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums;color:var(--tx2)}
.box .row.g{font-size:24px;font-weight:850;color:var(--tx)}
.box .row.rem{font-size:28px;font-weight:900;color:var(--ac)}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.opt{flex:1;min-width:76px;min-height:56px;border-radius:12px;background:var(--bg3);border:2px solid var(--line);font-weight:800;font-size:16px;line-height:1.1;padding:6px}
.opt small{display:block;font-size:12px;color:var(--tx3);font-weight:600}
.opt.on{border-color:var(--ac);background:var(--acs)}
.lbl{font-size:13px;color:var(--tx3);font-weight:800;text-transform:uppercase;letter-spacing:.7px;margin:14px 0 4px}
.chk{display:flex;align-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--bg3);margin-bottom:6px;border:2px solid transparent;width:100%;text-align:left}
.chk.on{border-color:var(--ac)}.chk span{flex:1}
.change{font-size:30px;font-weight:900;color:var(--ok);margin-top:10px}
.pe-row{display:grid;grid-template-columns:1fr 110px 80px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.pe-row input{padding:8px 10px;width:100%}
.pe-row .e{font-size:12px;color:var(--warn);font-weight:800}.pe-row .e.ok{color:var(--ok)}
/* modal & menu */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);display:none;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:flex}
.mbox{background:var(--bg2);border:1px solid var(--line);border-radius:18px;width:min(620px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.mh{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.mh h2{margin:0;flex:1;font-size:22px}
.mb{padding:14px 18px;overflow:auto}
.mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mod{background:var(--bg3);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;font-weight:750;min-height:56px}
.mod small{display:block;color:var(--tx3);font-weight:600;font-size:13px}
.mod.on{border-color:var(--ac);background:var(--acs)}
.menuList .btn{width:100%;justify-content:flex-start;margin-bottom:8px;font-size:18px}
.ticket{background:#fffef5;color:#111;font-family:"Courier New",ui-monospace,monospace;padding:16px;border-radius:6px;font-size:15px;line-height:1.4}
.ticket h3{text-align:center;margin:0 0 4px;font-size:18px}.ticket .c{text-align:center}
.ticket hr{border:0;border-top:1px dashed #555;margin:8px 0}
.ticket .it{font-weight:700}.ticket .mm{padding-left:22px}.ticket .rw{display:flex;justify-content:space-between}
#note{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#0f3d38;border:1px solid var(--ac);color:#ccfbf1;padding:12px 20px;border-radius:12px;font-weight:750;opacity:0;pointer-events:none;transition:.18s;z-index:70;max-width:90vw;text-align:center}
#note.on{opacity:1;transform:translateX(-50%)}
#foot{font-size:12px;color:var(--tx3);text-align:center;padding:30px 10px 4px}

function ensureBuiltinAddons(){const builtin=[{id:'ad-wing-sm',name:'Extra Wing Sauce (Small)',price:0.75,cats:['win'],items:[]},{id:'ad-wing-lg',name:'Extra Wing Sauce (Large)',price:1,cats:['win'],items:[]}];

function totals(t){let sub=0,taxable=0,food=0;for(const l of t.lines){const v=lineTotal(l);sub+=v;if(!ITEM[l.itemId].taxExempt){taxable+=v;food+=v}}
 sub=r2(sub);const tax=r2(taxable*S.taxRate/100);let tip=0;if(t.tipAmt!=null)tip=r2(t.tipAmt);else if(t.tipPct)tip=r2(food*t.tipPct/100);
 const total=r2(sub+tax+tip);const paid=r2((t.payments||[]).reduce((a,p)=>a+p.amount,0));return{sub,tax,tip,total,paid,rem:r2(total-paid),food:r2(food)}}

 if(l)l.qty++;else{l={uid:'l'+Date.now().toString(36)+Math.random().toString(36).slice(2,7),itemId:id,qty:1,mods:mods.slice(),sent:false,paid:false};t.lines.push(l)}

function searchResults(){const q=U.q.trim().toLowerCase();const words=q.split(/\s+/).filter(Boolean);
 const res=MENU.filter(m=>{const hay=(m.name+' '+m.desc+' '+CAT[m.cat].name+' '+(CAT[m.cat].short||'')).toLowerCase();return words.every(w=>hay.includes(w))});

 if(!uniq.length)return `<div class="empty"><div class="e">🤷</div><h2>No items match “${esc(U.q)}”</h2><p>Try fewer letters, or tap a category.</p><button class="btn pri" data-a="clearq">Clear search</button></div>`;

const EMP=id=>S.emps.find(e=>e.id===id);
const empName=id=>{const e=id&&EMP(id);return e?e.name:''};
const activeEmps=()=>S.emps.filter(e=>!e.removed);
const openPunch=id=>S.punches.find(p=>p.empId===id&&!p.out);
const onClock=()=>activeEmps().filter(e=>openPunch(e.id));
function wkStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-d.getDay());return d.getTime()}
function dayStart(ts){const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()}
function addDays(ts,n){const d=new Date(ts);d.setDate(d.getDate()+n);return d.getTime()}
function overlap(p,a,b){const e=p.out||Date.now();return Math.max(0,Math.min(e,b)-Math.max(p.in,a))}
function hoursFor(empId,a,b){return S.punches.filter(p=>p.empId===empId).reduce((s,p)=>s+overlap(p,a,b),0)/36e5}
const fmtH=h=>{const m=Math.round(h*60);return Math.floor(m/60)+'h '+String(m%60).padStart(2,'0')+'m'};
const decH=h=>(Math.round(h*100)/100).toFixed(2);
const fT=ts=>new Date(ts).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});
const fD=ts=>new Date(ts).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'});
const fDT=ts=>fD(ts)+' '+fT(ts);
const weekLabel=ws=>fD(ws)+' – '+fD(addDays(ws,6));
const ymd=ts=>{const d=new Date(ts);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const parseYmd=s=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?new Date(+m[1],+m[2]-1,+m[3]).getTime():null};
function bar(title,right){return `<div class="bar"><button class="homeBtn" data-a="home">⌂ Home</button><h1 style="margin:0;flex:1;font-size:24px">${title}</h1>${right||''}</div>`}

function srvLine(t){const n=empName(t.empId);const me=S.curEmp&&S.curEmp!==t.empId&&EMP(S.curEmp);
 if(!n&&!me)return '';return `<div class="srv">👤 ${n?esc(n):'No server'}${me?`<button class="lk" data-a="taketab">Assign to ${esc(EMP(S.curEmp).name)}</button>`:''}</div>`}
/* ---------- manager PIN ---------- */
const mgrOk=()=>(U.mgrUntil||0)>Date.now();
function needMgr(fn){if(mgrOk()){U.mgrUntil=Date.now()+MGR_MS;fn();return}
 U.pin='';U.mgrNext=fn;modal('🔒 Manager PIN',pinPadHTML('mgr','Manager PIN required')+(S.mgrPin==='0000'?'<p style="color:var(--tx3);font-size:13px;text-align:center">Default PIN is 0000 — change it in ⚙ Settings.</p>':''),`<button class="btn" data-a="close">Cancel</button>`)}
/* ---------- void item (manager only) ---------- */
const VOID_REASONS=['Wrong item','Customer changed mind','Comped','Kitchen error','Other'];
function openVoid(uid){const t=active();const l=t&&t.lines.find(x=>x.uid===uid);if(!l||l.voided)return;
 if(l.paid){notify('Paid items can’t be voided');return}
 if((t.payments||[]).length){notify('Can’t void after a payment has been taken on this check');return}
 needMgr(()=>voidReasonModal(uid))}
function voidReasonModal(uid){const t=active();const l=t&&t.lines.find(x=>x.uid===uid);if(!l||l.voided||l.paid)return;
 U.modalCtx={type:'void',uid,reason:'Wrong item',other:''};drawVoidReason()}
function drawVoidReason(){const C=U.modalCtx;const t=active();const l=t&&t.lines.find(x=>x.uid===C.uid);if(!l){closeModal();return}
 const m=ITEM[l.itemId];
 modal('🗑 Void item',`<p style="margin-top:0">Void <b>${esc(m.name)}</b> ×${l.qty} (${money(lineAmt(l))})? Only a manager can approve this. The item stays on the check as VOID for $0.</p>
  <div class="lbl">Reason</div><div class="vr">${VOID_REASONS.map(r=>`<button class="mod${C.reason===r?' on':''}" data-a="voidwhy" data-id="${esc(r)}">${esc(r)}</button>`).join('')}</div>
  ${C.reason==='Other'?`<input id="vother" placeholder="Type the reason" value="${esc(C.other||'')}" autocomplete="off">`:''}
  ${l.sent?'<p style="color:var(--warn)">This was already sent to the kitchen. A void ticket will be shown so the kitchen can stop it.</p>':''}
  <p style="color:var(--tx3);font-size:13px">Paid items can’t be voided. If a payment is already on this check, void isn’t available.</p>`,`<button class="btn" data-a="close">Cancel</button><button class="btn bad" data-a="voidgo">Void item</button>`);
 if(C.reason==='Other')setTimeout(()=>{const i=$('#vother');i&&i.focus()},30)}
function voidGo(){const C=U.modalCtx;const t=active();const l=t&&C&&t.lines.find(x=>x.uid===C.uid);
 if(!l||l.voided||l.paid||(t.payments||[]).length){closeModal();notify(l&&l.paid?'Paid items can’t be voided':(t&&(t.payments||[]).length?'Can’t void after a payment has been taken on this check':'Nothing to void'));return}
 let reason=C.reason||'Other';
 if(reason==='Other'){const o=((($('#vother')||{}).value)||C.other||'').trim();if(!o){notify('Type a reason for Other');return}reason=o}
 const amt=lineAmt(l),wasSent=!!l.sent,empId=t.empId||S.curEmp||null;
 l.voided=true;l.voidReason=reason;l.voidAt=Date.now();l.voidAmt=amt;
 const rec={id:mkId('v'),time:l.voidAt,itemId:l.itemId,name:ITEM[l.itemId].name,qty:l.qty,price:amt,mods:(l.mods||[]).slice(),reason,empId,empName:empName(empId)||'(no server)',mgr:'Manager',tabId:t.id,tabName:t.name,sent:wasSent};
 S.voids.push(rec);save();closeModal();render();notify('Voided '+ITEM[l.itemId].name);
 if(wasSent)showVoidTicket(rec)}
function showVoidTicket(rec){const html=`<div class="ticket"><h3>*** VOID TICKET ***</h3><div class="c">${esc(rec.tabName)} · ${fT(rec.time)}</div><hr>
  <div class="it">VOID ${rec.qty} × ${esc(rec.name)}</div>${(rec.mods||[]).map(m=>`<div class="mm">→ ${esc(m.n)}</div>`).join('')}
  <div class="mm">Reason: ${esc(rec.reason)}</div>
  <hr><div class="c">Approved by ${esc(rec.mgr||'Manager')}${rec.empName&&rec.empName!=='(no server)'?' · Rang by '+esc(rec.empName):''}</div></div>`;
 U._ticket=html;modal('🛑 Void sent to kitchen',html,`<button class="btn" data-a="printticket">🖨 Print Void Ticket</button><button class="btn pri" data-a="close">OK</button>`)}
/* ---------- PIN keypad ---------- */
function pinPadHTML(ctx,msg){const n=(U.pin||'').length;
 return `<div class="pinwrap" data-ctx="${ctx}"><div class="pindots">${[0,1,2,3].map(i=>`<i class="${i<n?'f':''}"></i>`).join('')}</div><div class="pinmsg">${msg||'Enter your 4-digit PIN'}</div>
 <div class="pinpad">${['1','2','3','4','5','6','7','8','9','clr','0','back'].map(k=>`<button class="${k.length>1?'fn':''}" data-a="pk" data-id="${k}" aria-label="${k==='clr'?'Clear':k==='back'?'Backspace':k}">${k==='clr'?'Clear':k==='back'?'⌫':k}</button>`).join('')}</div></div>`}
function pinWrap(){return $('#modal.on .pinwrap')||($('#modal.on')?null:$('#content .pinwrap'))}
function pinKey(k){const w=pinWrap();if(!w||U.pinBusy)return;U.pin=U.pin||'';
 if(k==='clr')U.pin='';else if(k==='back')U.pin=U.pin.slice(0,-1);else if(/^\d$/.test(k)&&U.pin.length<4)U.pin+=k;
 w.querySelectorAll('.pindots i').forEach((d,i)=>d.classList.toggle('f',i<U.pin.length));const m=w.querySelector('.pinmsg');if(m.classList.contains('bad')){m.classList.remove('bad');m.textContent=w.dataset.ctx==='mgr'?'Manager PIN required':'Enter your 4-digit PIN'}
 if(U.pin.length===4){U.pinBusy=true;setTimeout(()=>{U.pinBusy=false;submitPin(w.dataset.ctx)},140)}}
function pinErr(msg){U.pin='';const w=pinWrap();if(!w)return;w.querySelectorAll('.pindots i').forEach(d=>d.classList.remove('f'));const m=w.querySelector('.pinmsg');m.textContent=msg;m.classList.add('bad');w.classList.remove('shake');void w.offsetWidth;w.classList.add('shake')}
function submitPin(ctx){const pin=U.pin;
 if(ctx==='mgr'){if(pin===S.mgrPin){U.mgrUntil=Date.now()+MGR_MS;const nx=U.mgrNext;U.mgrNext=null;U.pin='';closeModal();notify('🔓 Manager mode on (10 min)');nx&&nx()}else pinErr('Wrong manager PIN — try again');return}
 if(ctx==='clock'){const e=activeEmps().find(x=>x.pin===pin);if(!e){pinErr(activeEmps().length?'PIN not found — try again':'No employees yet — a manager adds the team first');return}
  U.pin='';if(openPunch(e.id))clockPrompt(e);else clockIn(e)}}

 const ws=wkStart(now);U.modalCtx={type:'clkin'};
 modal('⏱ Clocked In',`<div class="empty" style="padding:16px"><div class="e">👋</div><h2 id="clkmsg">Welcome, ${esc(e.name)}!</h2><p>Clocked in at <b>${fT(now)}</b> · <span class="role ${e.role}">${e.role}</span></p><p>This week so far: <b>${fmtH(hoursFor(e.id,ws,addDays(ws,7)))}</b></p><p style="color:var(--tx3);font-size:14px">New tabs you open are credited to you for your shift report.</p></div>`,`<button class="btn pri big" data-a="close" style="flex:1">OK</button>`)}
function clockPrompt(e){const p=openPunch(e.id);U.modalCtx={type:'clk',empId:e.id};
 modal('⏱ '+esc(e.name),`<p style="font-size:18px;margin-top:0"><span class="role ${e.role}">${e.role}</span> On the clock since <b>${fT(p.in)}</b> (${fmtH((Date.now()-p.in)/36e5)}).</p><p style="color:var(--tx3);font-size:14px">Clock out to end your shift and see your shift report. “Ring orders as me” just switches the register to you.</p>`,
 `<button class="btn" data-a="close">Cancel</button>${S.curEmp!==e.id?`<button class="btn" data-a="asme" data-id="${e.id}">👤 Ring orders as ${esc(e.name)}</button>`:''}<button class="btn bad big" data-a="clockout" data-id="${e.id}">⏹ Clock Out</button>`)}
function clockOut(empId){const p=openPunch(empId);if(!p)return;p.out=Date.now();
 if(S.curEmp===empId){const nx=onClock()[0];S.curEmp=nx?nx.id:null}
 save();render();showShift(p.id)}
function shiftHTML(p){const e=EMP(p.empId)||{name:'?',role:''};const end=p.out||Date.now();const hrs=(end-p.in)/36e5;
 const rs=S.closed.filter(r=>r.empId===p.empId&&r.closedAt>=p.in&&r.closedAt<=end);
 const sum=k=>r2(rs.reduce((a,r)=>a+(r[k]||0),0));const pm={cash:0,card:0};rs.forEach(r=>(r.payments||[]).forEach(x=>pm[x.method]=r2((pm[x.method]||0)+x.amount)));
 const ws=wkStart(p.in);const wk=hoursFor(p.empId,ws,addDays(ws,7));const row=(a,b)=>`<div class="rw"><span>${a}</span><span>${b}</span></div>`;
 return `<div class="ticket"><h3>SHIFT REPORT</h3><div class="c">Front Door Tavern</div><hr><div class="rw it"><span>${esc(e.name)}</span><span>${esc(e.role)}</span></div>
 ${row('Clock in',fDT(p.in))}${row('Clock out',p.out?fDT(p.out):'(still on)')}<div class="rw it"><span>Hours worked</span><span id="sh-hours">${fmtH(hrs)} (${decH(hrs)})</span></div><hr>
 ${row('Orders closed',rs.length)}${row('Net sales',money(sum('sub')))}${row('Tax (est.)',money(sum('tax')))}<div class="rw it"><span>Tips</span><span id="sh-tips">${money(sum('tip'))}</span></div>${row('Total w/ tax &amp; tips','<span id="sh-sales">'+money(sum('total'))+'</span>')}${row('Cash taken',money(pm.cash))}${row('Card taken',money(pm.card))}<hr>
 ${row('Week of '+fD(ws),'')}<div class="rw it"><span>Week hours to date</span><span>${fmtH(wk)} (${decH(wk)})</span></div><div class="c" style="font-size:12px">Weekly hours reset Sunday 12:00 AM</div></div>`}
function showShift(pid){const p=S.punches.find(x=>x.id===pid);if(!p)return;const h=shiftHTML(p);U._shift=h;
 modal('🧾 Shift Report',h,`<button class="btn" data-a="printshift">🖨 Print</button><button class="btn pri" data-a="close">Done</button>`)}
function clockHTML(){const now=Date.now(),ws=wkStart(now),we=addDays(ws,7);const oc=onClock();const es=activeEmps();
 return bar('⏱ Time Clock')+`<div class="clockg"><div class="box">${pinPadHTML('clock')}<p style="color:var(--tx3);font-size:14px;text-align:center;margin-bottom:0">Enter your PIN to clock in. Enter it again to clock out and get your shift report.</p></div>
 <div><div class="box"><div class="lbl" style="margin-top:0">On the clock now (${oc.length})</div><div class="who-l" id="onclock">${oc.length?oc.map(e=>{const p=openPunch(e.id);return `<div class="w"><span class="dot"></span><b>${esc(e.name)}</b><span class="role ${e.role}">${e.role}</span><span style="color:var(--tx2);font-size:14px">since ${fT(p.in)} · ${fmtH((now-p.in)/36e5)}</span></div>`}).join(''):'<p style="color:var(--tx3);margin:4px 0">Nobody is clocked in.</p>'}</div></div>
 ${es.length?`<div class="box" style="margin-top:12px"><div class="lbl" style="margin-top:0">Hours this week · ${weekLabel(ws)}</div><table class="t" id="wkhours">${es.map(e=>`<tr><td>${esc(e.name)} <span class="role ${e.role}">${e.role}</span></td><td class="n">${fmtH(hoursFor(e.id,ws,we))}</td></tr>`).join('')}</table><p style="color:var(--tx3);font-size:13px;margin-bottom:0">Resets every Sunday at 12:00 AM. Past weeks are kept in 🕒 Weekly Hours.</p></div>`

 if(!name)return drawEmp('Enter a name.');if(!/^\d{4}$/.test(pin))return drawEmp('PIN must be exactly 4 digits.');

/* ---------- sales report ---------- */

 `<p style="color:var(--tx2);margin-top:0">Tap a check number next to each item. Each check becomes its own tab you can pay separately.</p>
 <div class="opts" id="checksum">${sums.map((s,k)=>`<div class="opt" style="cursor:default"><b>Check ${k+1}</b><small>${cnt[k]} item${cnt[k]===1?'':'s'} · ${money(s)}</small></div>`).join('')}<button class="opt" data-a="scadd" ${C.n>=8?'disabled':''}>＋ Check</button></div>
 <div id="scunits">${us.map(u=>{const m=ITEM[u.l.itemId];const c=Math.min(C.as[u.key]||0,C.n-1);return `<div class="sc-unit" style="--cc:${CAT[m.cat].color}"><span class="n">${esc(m.name)} <span style="color:var(--tx3)">${money(unit(u.l))}</span>${u.l.mods.length?`<small>${u.l.mods.map(x=>esc(x.n)).join(', ')}</small>`:''}</span>${Array.from({length:C.n},(_,k)=>`<button class="${c===k?'on':''}" data-a="scset" data-id="${u.key}|${k}" aria-label="Move to check ${k+1}">${k+1}</button>`).join('')}</div>`}).join('')}</div>
 <button class="btn big pri" style="width:100%;margin-top:10px" data-a="scgo" ${used>=2?'':'disabled'}>✂ Create ${used>=2?used:''} separate checks</button><p style="color:var(--tx3);font-size:13px">Subtotals shown before tax &amp; tip.</p>`}</div></div>`}
function splitGo(){const t=active();const C=U.sc;if(!t||!C||(t.payments||[]).length)return;const us=unitsOf(t);const groups=Array.from({length:C.n},()=>({}));
 us.forEach(u=>{const c=Math.min(C.as[u.key]||0,C.n-1);groups[c][u.l.uid]=(groups[c][u.l.uid]||0)+1});const g=groups.filter(x=>Object.keys(x).length);if(g.length<2)return;
 const base=t.name;const mk=gr=>Object.entries(gr).map(([luid,q])=>{const l=t.lines.find(x=>x.uid===luid);return{uid:mkId('l'),itemId:l.itemId,qty:q,mods:l.mods.slice(),sent:l.sent,paid:false}});
 const voids=t.lines.filter(l=>l.voided);const lines0=g.map(mk);t.lines=lines0[0].concat(voids);t.name=base+' · 1';t.tipAmt=null;t.even=null;const idx=S.tabs.indexOf(t);
 const nt=lines0.slice(1).map((ls,i)=>({id:mkId('t'),name:base+' · '+(i+2),created:Date.now(),lines:ls,payments:[],tipPct:t.tipPct,tipAmt:null,empId:t.empId||null}));
 S.tabs.splice(idx+1,0,...nt);U.sc=null;U.screen='tabs';save();render();notify('Split into '+g.length+' checks — pay each one separately')}
/* ---------- extra actions ---------- */
const ACT={
 who:()=>{closeModal();goScreen('clock')},
 pk:id=>pinKey(id),
 clockout:id=>{closeModal();clockOut(id)},
 asme:id=>{S.curEmp=id;closeModal();render();notify('Register is now ringing as '+empName(id))},
 mgrout:id=>{const e=EMP(id);if(e&&confirm('Clock out '+e.name+' now?'))clockOut(id)},
 shiftrep:id=>showShift(id),
 printshift:()=>doPrint(U._shift||''),
 printhours:id=>doPrint(hoursPrint(+id)),
 empnew:()=>empForm(null),empedit:id=>empForm(id),
 emprole:id=>{syncEmp();U.modalCtx.role=id;drawEmp()},
 emprand:()=>{syncEmp();U.modalCtx.v.pin=freePin();drawEmp()},
 empsave:()=>empSave(),
 empdel:id=>{const e=EMP(id);if(!e||!confirm('Remove '+e.name+'? Their past hours stay in the history.'))return;const p=openPunch(id);if(p)p.out=Date.now();e.removed=true;if(S.curEmp===id)S.curEmp=null;render();notify('Removed '+e.name)},
 taketab:()=>{const t=active();if(t&&S.curEmp){t.empId=S.curEmp;render();notify(t.name+' assigned to '+empName(S.curEmp))}},
 rep:id=>{U.rep=Object.assign(U.rep||{},{mode:id});if(id==='custom'){const d=ymd(Date.now());U.rep.from=U.rep.from||d;U.rep.to=U.rep.to||d}renderContent()},
 printrep:()=>doPrint(reportPrint()),
 additem:()=>{closeModal();needMgr(()=>itemForm(null))},
 itemedit:id=>itemForm(id),itemsave:()=>itemSave(),itemdel:id=>itemDel(id),
 itemrestore:()=>{Object.values(S.menuEdits).forEach(e=>e.deleted=false);applyMenu(S);render();notify('Removed items restored')},
 adnew:()=>addonForm(null),adedit:id=>addonForm(id),adsave:()=>addonSave(),
 addel:id=>{const a=S.addons.find(x=>x.id===id);if(a&&confirm('Delete add-on “'+a.name+'”?')){S.addons=S.addons.filter(x=>x!==a);render();notify('Deleted '+a.name)}},
 adcat:id=>{syncAddon();const C=U.modalCtx;C.cats=C.cats.includes(id)?C.cats.filter(x=>x!==id):[...C.cats,id];drawAddonForm()},
 aditem:id=>{syncAddon();const C=U.modalCtx;C.items=C.items.includes(id)?C.items.filter(x=>x!==id):[...C.items,id];if(!C.items.includes(id)||true)C.q='';drawAddonForm()},
 apt:id=>{const C=U.modalCtx;C.sel=C.sel.includes(id)?C.sel.filter(x=>x!==id):[...C.sel,id];drawAddonPick()},
 apskip:()=>{const C=U.modalCtx;closeModal();addItem(C.id,C.pre)},
 apadd:()=>{const C=U.modalCtx;const list=addonsFor(ITEM[C.id]);const mods=C.pre.concat(list.filter(a=>C.sel.includes(a.id)).map(a=>({n:a.name,p:a.price})));closeModal();addItem(C.id,mods)},
 voidline:id=>openVoid(id),
 voidwhy:id=>{const C=U.modalCtx;if(!C||C.type!=='void')return;C.reason=id;if($('#vother'))C.other=$('#vother').value;if(id!=='Other')C.other='';drawVoidReason()},
 voidgo:()=>voidGo(),
 saucet:id=>{const C=U.modalCtx;if(!C||C.type!=='sauce')return;C.sel=C.sel||[];if(C.sel.includes(id))C.sel=C.sel.filter(x=>x!==id);else C.sel.push(id);drawSauce()},
 sauceadd:()=>{const C=U.modalCtx;if(!C||C.type!=='sauce'||!(C.sel||[]).length)return;const mods=C.sel.map(n=>({n,p:0}));const id=C.id;closeModal();if(addonsFor(ITEM[id]).length)openAddonPick(id,mods);else addItem(id,mods)},
 split2:()=>{const t=active();if(!t||!t.lines.filter(isLive).length)return;U.sc={n:2,as:{},tab:t.id};goScreen('splitcheck')},
 scadd:()=>{if(U.sc.n<8){U.sc.n++;renderContent()}},
 scset:id=>{const[k,c]=id.split('|');U.sc.as[k]=+c;renderContent()},
 scgo:()=>splitGo(),
 evengo:id=>{const t=active();if(!t)return;if(!t.even||!t.even.paid.some(x=>x!=null))t.even={n:+id,paid:[]};U.pay={mode:null,split:'even',n:2,sel:{},tendered:'',guest:null};goScreen('pay')},
 guest:id=>{U.pay.guest=+id;U.pay.mode=null;render()},
 mgrpin:()=>{const a=$('#mp1').value,b=$('#mp2').value;if(!/^\d{4}$/.test(a)){notify('PIN must be 4 digits');return}if(a!==b){notify('PINs don’t match');return}S.mgrPin=a;save();renderContent();notify('Manager PIN changed')},
 mgrlock:()=>{U.mgrUntil=0;closeModal();if(GATED.has(U.screen))U.screen='home';render();notify('🔒 Manager mode locked')}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;const f=ACT[el.dataset.a];if(f)f(el.dataset.id,el)});
document.addEventListener('change',e=>{const el=e.target;if(el.id==='rfrom'||el.id==='rto'){U.rep[el.id==='rfrom'?'from':'to']=el.value;renderContent()}});
document.addEventListener('keydown',e=>{if(!pinWrap())return;const ae=document.activeElement;if(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT'))return;
 if(/^\d$/.test(e.key)){e.preventDefault();pinKey(e.key)}else if(e.key==='Backspace'){e.preventDefault();pinKey('back')}});

function tick(){const d=new Date();$('#clock').innerHTML=`<b>${d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})}</b><span>${d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric',year:'numeric'})}</span>`}
load();tick();setInterval(tick,10000);render();
</script>
</body></html>
